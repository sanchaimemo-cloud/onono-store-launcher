<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OnonoStore</title>
    
    <!-- 📌 เรียกใช้งานไฟล์ Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- 📌 ตั้งค่าไอคอนสำหรับ iOS และ Android -->
    <link rel="icon" type="image/png" href="./OnonoStore.png">
    <link rel="apple-touch-icon" href="./OnonoStore.png">
    
    <!-- 📌 ตั้งค่าให้เปิดแบบเต็มจอเสมือนแอปจริง (Standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OnonoStore">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #F7F5FB; font-family: sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .loading {
            text-align: center; color: #6D28D9; font-weight: bold; font-size: 16px;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e9d5ff;
            border-top: 4px solid #6D28D9; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        iframe {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            border: none; z-index: 10; display: none;
        }
    </style>
</head>
<body>

    <!-- หน้าจอโหลดชั่วขณะก่อนเปลี่ยนไปรันระบบจริง -->
    <div id="loader" class="loading">
        <div class="spinner"></div>
        กำลังเปิด OnonoStore...
    </div>

    <!-- โหลด Google Apps Script Web App ผ่าน iframe เต็มจอ -->
    <!-- ⚠️ สำคัญ: แทนที่ URL ด้านล่างด้วยลิงก์ Web App ของคุณ -->
    <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbx_nbV4hyoWySB_HhGxFFHNmRG4E1TUHpIa-mDUqjBpxYl-MV1R037TnLMxPaEAf-_9/exec"></iframe>

    <script>
        // ซ่อนตัวโหลดแล้วแสดงระบบจริงเมื่อ iframe โหลดเสร็จ
        document.getElementById('appFrame').onload = function() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('appFrame').style.display = 'block';
        };
    </script>
</body>
</html>
